name: Windows çekirdek

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "desktop_build/windows/smoke_core.py"
      - ".github/workflows/windows-core.yml"

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Çekirdeği kur
        run: python -m pip install -e .
      - name: Açılış isteklerini dene
        env:
          PYTHONUTF8: "1"
        run: python desktop_build/windows/smoke_core.py fusion app
