name: Windows çekirdek

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "desktop_build/windows/smoke_core.py"
      - ".github/workflows/windows-core.yml"

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Çekirdeği kur
        run: python -m pip install -e .
      - name: Açılış isteklerini dene
        env:
          PYTHONUTF8: "1"
        # Takılırsa 90 sn sonra tüm iş parçacıklarının yığını hata çıktısına dökülür
        # ve çekirdek kapanır; betik bu çıktıyı basar.
        run: python desktop_build/windows/smoke_core.py python -X faulthandler -c "import faulthandler, sys; faulthandler.dump_traceback_later(90, exit=True); sys.argv = ['fusion', 'app']; from fusion_cli.cli.app import main; main()"
