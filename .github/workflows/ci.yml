name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Masaüstü sürümü (`desktop.yml` → `release`) bu kapıyı yeniden kullanır: testler
  # kırmızıyken etiket atılsa da Release oluşmasın.
  workflow_call:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust değerlendirmelerinde kurulu derleyiciyi kullan
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, subprocess
          compiler = subprocess.check_output(["rustup", "which", "rustc"], text=True).strip()
          with pathlib.Path(os.environ["GITHUB_PATH"]).open("a", encoding="utf-8") as path:
              path.write(str(pathlib.Path(compiler).parent) + "\n")
          PY
      - name: Bağımlılıkları kur
        run: make install
      # Davranış değerlendirmesi ve web oturumu testleri gerçek Chromium açar.
      - name: Chromium'u kur
        run: python -m playwright install --with-deps chromium
      # Yerelde çalıştırılan kapının birebir aynısı; CI'a özel kural yoktur.
      # `make check` = lint + type + test + deadlock.
      - name: Kalite kapısı
        run: make check

      # Kilitlenme ağı AYRI bir adım olarak da görünür.
      #
      # `make check` onu zaten kapsıyor; buradaki tekrar bilinçlidir. Bu paketler
      # kapıların ETKİLEŞİMİNİ koruyor ve bugüne kadarki tüm kilitlenmeler oradan
      # çıktı. Ayrı adım, bir regresyonun CI çıktısında 1900 testin arasında
      # kaybolmasını engeller: kırılırsa hangi sınıfın bozulduğu adının kendisinden
      # okunur.
      - name: Kilitlenme ağı
        run: make deadlock
