name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Bağımlılıkları kur
        run: make install
      # Yerelde çalıştırılan kapının birebir aynısı; CI'a özel kural yoktur.
      # `make check` = lint + type + test + deadlock.
      - name: Kalite kapısı
        run: make check

      # Kilitlenme ağı AYRI bir adım olarak da görünür.
      #
      # `make check` onu zaten kapsıyor; buradaki tekrar bilinçlidir. Bu paketler
      # kapıların ETKİLEŞİMİNİ koruyor ve bugüne kadarki tüm kilitlenmeler oradan
      # çıktı. Ayrı adım, bir regresyonun CI çıktısında 1900 testin arasında
      # kaybolmasını engeller: kırılırsa hangi sınıfın bozulduğu adının kendisinden
      # okunur.
      - name: Kilitlenme ağı
        run: make deadlock
