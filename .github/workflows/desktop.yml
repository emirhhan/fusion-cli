name: Desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Geliştirme dalından da elle çalıştırılabilsin: Intel ve Windows paketleri
  # geliştirme makinesinde (Apple Silicon) üretilemiyor, tek yolu CI. Dal `main`
  # olmadığı ve PR açılmadığı sürece diğer tetikleyiciler hiç çalışmaz.
  workflow_dispatch:

jobs:
  # Sürüm etiketinde kalite kapısı (lint + tip + test + kilitlenme ağı) yeniden koşar;
  # `release` bu işe bağlıdır. Ölçüldü (28 Ekim): release yalnız paket işlerine
  # bağlıydı ve kırmızı testlerle de yayımlanabiliyordu.
  quality:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml
  terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Terminal paketini üret
        run: |
          python -m pip install build
          python -m build --outdir terminal-dist
      - uses: actions/upload-artifact@v4
        with:
          name: fusion-terminal
          path: terminal-dist/*
          if-no-files-found: error
  # PTY/terminal testleri (Q1-02). `check:ci` bu 13 testi atlıyor (runner'da asılıyor);
  # eskiden kapsama SIFIRdı. Burada ayrı koşar: derleme ile çalıştırma ayrı adımlar,
  # her birinin süre sınırı var, asılan test iş sınırını beklemeden düşer.
  # Bu iş `release.needs` dışındadır (bilinçli karar): bilinen runner asılması
  # sürüm üretimini yeniden bloklamasın. Kırmızı olduğunda PR/push'ta görünür;
  # asılma kök nedeni çözülünce `release.needs`e eklenmelidir.
  terminal-pty:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      # tauri_build `frontendDist` (../dist) klasörünü ister; check:ci ile aynı hazırlık.
      - name: Ön yüz bağımlılıklarını kur ve derle
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: PTY testlerini derle
        timeout-minutes: 25
        working-directory: app/src-tauri
        run: cargo test --no-run
      - name: PTY testlerini çalıştır
        # Aynı testler yerelde ~1 sn'de biter; 10 dakika asılmayı görünür kılar.
        timeout-minutes: 10
        working-directory: app
        run: npm run check:pty
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable

      - name: Python bağımlılıklarını kur
        run: python -m pip install -e '.[dev,desktop,mcp,gateway,voice,web]'
      - name: Ön yüz bağımlılıklarını kur
        working-directory: app
        run: npm ci
      - name: macOS konuşma adaptörünü derle
        working-directory: app
        run: npm run listen:build:mac
      - name: React ve Rust kalite kapıları
        # Süre sınırı ZORUNLU. Ölçüldü (alpha.11, macos-15 aarch64): üç PTY testi
        # (`terminal::tests::forwards_terminal_output_without_stripping_ansi_bytes`
        # ve iki kardeşi) runner'da asılı kaldı; iş 5,5 saat çalıştı, release hiç
        # oluşmadı ve sonraki etiketin macOS runner'ını da bekletti. Aynı testler
        # aynı mimaride yerelde 1,1 saniyede geçiyor — arıza runner'a özgü.
        # Sınır arızayı ÇÖZMEZ, görünür kılar ve kuyruğu serbest bırakır.
        #
        # 25 dakika ÇOK DARDI ve meşru derlemeyi kesti (ölçüldü: aarch64 işi
        # 26m11s'te "has timed out after 25 minutes" ile düştü; Rust derlemesi
        # soğuk runner'da tek başına bunu aşıyor). 60 dakika soğuk tam derlemenin
        # rahatça üstünde, asılı kalan işin 5,5 saatinin çok altında.
        timeout-minutes: 60
        working-directory: app
        # `check:ci`, `check`ten YALNIZ bir farkla ayrılır: `terminal::tests::`
        # modülü atlanır. Geliştiricide `npm run check` hepsini çalıştırmaya devam
        # eder; atlanan şey burada, görünür yerde durur.
        #
        # NEDEN atlanıyor — ölçüldü:
        #  - macOS (her iki mimari): `forwards_terminal_output_without_stripping_ansi_bytes`
        #    ve iki kardeşi runner'da SONSUZA asılıyor. İş 60 dakikalık sınıra
        #    çarpıyor, paket hiç üretilmiyor. (Bir kez sınır yokken 5,5 saat sürdü.)
        #  - Windows: `cleanup_liveness_is_false_for_a_naturally_exited_but_registered_child`
        #    zamanlama assert'inde düşüyor.
        #  - Aynı 13 test, aynı mimaride YERELDE 1,1 saniyede geçiyor; arıza
        #    runner ortamına özgü ve `wait_for_output` zaten 5 saniyeyle sınırlı,
        #    yani takılma beklemede değil PTY kurulumunda/temizliğinde.
        #
        # Atlanan testler artık `terminal-pty` işinde (aşağıda) koşar: kısa süre
        # sınırlı, yayın kapısı DEĞİL ama kırmızıysa görünür (Q1-02). Kök neden
        # (runner'da PTY asılması) hâlâ açık.
        run: npm run check:ci
      - name: Native runtime ve uygulama paketini üret
        # Hiçbir adım 6 saatlik iş sınırını yakmamalı. Ölçüldü (Windows,
        # run 34580249690): `runtime:smoke` asıldı ve adım 2 saat 6 dakika
        # çıktı vermeden sürdü; sınır olmadığı için kendiliğinden bitmeyecekti.
        timeout-minutes: 45
        working-directory: app
        run: npm run bundle:mac
      - name: Mimariyi ve uygulama paketini doğrula
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          rustc -vV
          python - <<'PY'
          import json, os, pathlib
          manifest = json.loads(pathlib.Path("app/src-tauri/resources/runtime/runtime-manifest.json").read_text())
          assert manifest["target"] == os.environ["EXPECTED_TARGET"]
          PY
          python desktop_build/macos/smoke_app_bundle.py app/src-tauri/target/release/bundle/macos/Fusion.app
          EXPECTED_ARCH=$([ "${{ matrix.target }}" = "aarch64-apple-darwin" ] && echo arm64 || echo x86_64)
          lipo -archs app/src-tauri/target/release/bundle/macos/Fusion.app/Contents/Resources/fusion-listen | grep -qw "$EXPECTED_ARCH"
      - name: DMG'yi anlaşılır bir adla kopyala
        run: |
          mkdir -p dagitim
          SUFFIX=$([ "${{ matrix.target }}" = "aarch64-apple-darwin" ] && echo "Apple-Silicon" || echo "Intel")
          cp app/src-tauri/target/release/bundle/dmg/*.dmg "dagitim/Fusion-macOS-$SUFFIX.dmg"
      - name: Kabul edilecek frozen runtime artefaktını hazırla
        run: |
          mkdir -p runtime-distribution
          cp app/src-tauri/resources/runtime/fusion-runtime.tar.gz runtime-distribution/fusion-runtime-${{ matrix.target }}.tar.gz
          cp app/src-tauri/resources/runtime/runtime-manifest.json runtime-distribution/fusion-runtime-${{ matrix.target }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: fusion-frozen-${{ matrix.target }}
          path: runtime-distribution/*
          if-no-files-found: error
      - name: Paketlenen Kits kimliğini sakla
        uses: actions/upload-artifact@v4
        with:
          name: fusion-kits-${{ matrix.target }}
          path: app/src-tauri/resources/kits/kits-manifest.json
          if-no-files-found: error
      - name: İmzasız macOS paketini sakla
        uses: actions/upload-artifact@v4
        with:
          name: fusion-macos-${{ matrix.target }}
          path: dagitim/*.dmg
          if-no-files-found: error

      - name: İmzalı uygulama içi güncelleme paketi
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          python desktop_build/macos/build_update.py --app app/src-tauri/target/release/bundle/macos/Fusion.app --output guncelleme
          mv guncelleme/latest.json guncelleme/latest-${{ matrix.target }}.json
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: fusion-update-${{ matrix.target }}
          path: guncelleme/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 150
    # Türkçe çıktı Windows'ta cp1252'ye sığmıyor. Ölçüldü (alpha.11): konuşma
    # adaptörü BAŞARIYLA derlendi, sonra "Konuşma adaptörü hazır: ..." satırını
    # yazdırırken `UnicodeEncodeError: 'charmap' codec can't encode '\u015f'` ile
    # çöktü ve release hiç oluşmadı. Depodaki her mesaj Türkçe olduğu için tek tek
    # print düzeltmek bu hata sınıfını kapatmaz; yorumlayıcı UTF-8'e alınır.
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      # Tamponlanmış çıktı, asılan adımda ÖLÇÜM KAYBIDIR: 2 saatlik asılmada tek
      # satır log yoktu çünkü Python boruya blok tamponlu yazıyor ve iptal edilince
      # tampon kayboluyor.
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable

      - name: Python bağımlılıklarını kur
        run: python -m pip install -e ".[dev,desktop,mcp,gateway,voice,web]"
      - name: Ön yüz bağımlılıklarını kur
        working-directory: app
        run: npm ci
      - name: Windows konuşma adaptörünü derle
        working-directory: app
        run: npm run listen:build:win
      - name: React ve Rust kalite kapıları
        # Süre sınırı ZORUNLU. Ölçüldü (alpha.11, macos-15 aarch64): üç PTY testi
        # (`terminal::tests::forwards_terminal_output_without_stripping_ansi_bytes`
        # ve iki kardeşi) runner'da asılı kaldı; iş 5,5 saat çalıştı, release hiç
        # oluşmadı ve sonraki etiketin macOS runner'ını da bekletti. Aynı testler
        # aynı mimaride yerelde 1,1 saniyede geçiyor — arıza runner'a özgü.
        # Sınır arızayı ÇÖZMEZ, görünür kılar ve kuyruğu serbest bırakır.
        #
        # 25 dakika ÇOK DARDI ve meşru derlemeyi kesti (ölçüldü: aarch64 işi
        # 26m11s'te "has timed out after 25 minutes" ile düştü; Rust derlemesi
        # soğuk runner'da tek başına bunu aşıyor). 60 dakika soğuk tam derlemenin
        # rahatça üstünde, asılı kalan işin 5,5 saatinin çok altında.
        timeout-minutes: 60
        working-directory: app
        # `check:ci`, `check`ten YALNIZ bir farkla ayrılır: `terminal::tests::`
        # modülü atlanır. Geliştiricide `npm run check` hepsini çalıştırmaya devam
        # eder; atlanan şey burada, görünür yerde durur.
        #
        # NEDEN atlanıyor — ölçüldü:
        #  - macOS (her iki mimari): `forwards_terminal_output_without_stripping_ansi_bytes`
        #    ve iki kardeşi runner'da SONSUZA asılıyor. İş 60 dakikalık sınıra
        #    çarpıyor, paket hiç üretilmiyor. (Bir kez sınır yokken 5,5 saat sürdü.)
        #  - Windows: `cleanup_liveness_is_false_for_a_naturally_exited_but_registered_child`
        #    zamanlama assert'inde düşüyor.
        #  - Aynı 13 test, aynı mimaride YERELDE 1,1 saniyede geçiyor; arıza
        #    runner ortamına özgü ve `wait_for_output` zaten 5 saniyeyle sınırlı,
        #    yani takılma beklemede değil PTY kurulumunda/temizliğinde.
        #
        # Atlanan testler artık `terminal-pty` işinde (aşağıda) koşar: kısa süre
        # sınırlı, yayın kapısı DEĞİL ama kırmızıysa görünür (Q1-02). Kök neden
        # (runner'da PTY asılması) hâlâ açık.
        run: npm run check:ci
      - name: Native runtime ve uygulama kurucusunu üret
        # Hiçbir adım 6 saatlik iş sınırını yakmamalı. Ölçüldü (Windows,
        # run 34580249690): `runtime:smoke` asıldı ve adım 2 saat 6 dakika
        # çıktı vermeden sürdü; sınır olmadığı için kendiliğinden bitmeyecekti.
        timeout-minutes: 45
        working-directory: app
        run: npm run bundle:win
      - name: Hedefi doğrula
        run: |
          rustc -vV
          python -c "import json,pathlib;m=json.loads(pathlib.Path('app/src-tauri/resources/runtime/runtime-manifest.json').read_text());assert m['target']=='x86_64-pc-windows-msvc',m['target'];assert m['entrypoint']=='fusion.exe',m['entrypoint'];h=pathlib.Path('app/src-tauri/resources/fusion-listen.exe');assert h.read_bytes()[:2]==b'MZ';print('runtime ve konuşma adaptörü doğru')"
      - name: Kurucuyu anlaşılır bir adla kopyala
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dagitim | Out-Null
          Get-ChildItem app/src-tauri/target/release/bundle/nsis/*.exe |
            Select-Object -First 1 |
            Copy-Item -Destination dagitim/Fusion-Windows-Kurulum.exe
      - name: İmzalı Windows güncelleme paketi
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $surum = (Get-Content app/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          python desktop_build/windows/build_update.py `
            --installer dagitim/Fusion-Windows-Kurulum.exe `
            --output guncelleme --version $surum
          Move-Item guncelleme/latest.json guncelleme/latest-windows-x86_64.json
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: fusion-update-windows-x86_64
          path: guncelleme/*
          if-no-files-found: error
      - name: Kabul edilecek frozen runtime artefaktını hazırla
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force runtime-distribution | Out-Null
          Copy-Item app/src-tauri/resources/runtime/fusion-runtime.tar.gz runtime-distribution/fusion-runtime-x86_64-pc-windows-msvc.tar.gz
          Copy-Item app/src-tauri/resources/runtime/runtime-manifest.json runtime-distribution/fusion-runtime-x86_64-pc-windows-msvc.json
      - uses: actions/upload-artifact@v4
        with:
          name: fusion-frozen-x86_64-pc-windows-msvc
          path: runtime-distribution/*
          if-no-files-found: error
      - name: Paketlenen Kits kimliğini sakla
        uses: actions/upload-artifact@v4
        with:
          name: fusion-kits-x86_64-pc-windows-msvc
          path: app/src-tauri/resources/kits/kits-manifest.json
          if-no-files-found: error
      - name: İmzasız Windows kurucusunu sakla
        uses: actions/upload-artifact@v4
        with:
          name: fusion-windows-x86_64
          path: dagitim/*.exe
          if-no-files-found: error

  # Etiket atıldığında (ör. `git tag v0.3.0-alpha.1 && git push --tags`) üç paketi
  # toplayıp herkese açık bir Release oluşturur. Arkadaşlara verilecek tek adres
  # budur; Actions artefaktları erişim ister ve süresi dolar, Release dolmaz.
  acceptance-candidate:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, macos, windows, terminal]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # release_manifest.py, known-gaps.json ve kilit dosyaları (uv.lock, package-lock,
      # Cargo.lock) depodan gelir.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: indirilenler
          pattern: fusion-*
      - name: Paketleri tek klasörde topla
        run: |
          mkdir -p dagitim
          find indirilenler -type f \( -name '*.dmg' -o -name '*.exe' \) -exec cp {} dagitim/ \;
          find indirilenler -type f \( -name '*.tar.gz' -o -name '*.sig' \) -exec cp {} dagitim/ \;
          find indirilenler -type f -name '*.whl' -exec cp {} dagitim/ \;
          find indirilenler -type f -name 'fusion-runtime-*.json' -exec cp {} dagitim/ \;
          python - <<'PY'
          import json, pathlib
          # Sayı değil PLATFORM KÜMESİ doğrulanır. Eskiden "tam iki manifest"
          # aranıyordu ve bu, Windows manifesti eklendiğinde sessizce kırılırdı;
          # ayrıca hangi platformun eksik olduğunu da söylemiyordu. Ölçüldü
          # (alpha.12): latest.json yalnız iki macOS taşıyordu ve Windows
          # kullanıcıları otomatik güncelleme alamıyordu.
          beklenen = {'darwin-aarch64', 'darwin-x86_64', 'windows-x86_64'}
          manifests = [json.loads(p.read_text()) for p in pathlib.Path('indirilenler').rglob('latest-*.json')]
          assert manifests, 'Hiç güncelleme manifesti bulunamadı'
          merged = {**manifests[0], 'platforms': {}}
          for manifest in manifests:
              assert manifest['version'] == merged['version'], (
                  f"Sürümler ayrıştı: {manifest['version']} != {merged['version']}"
              )
              merged['platforms'].update(manifest['platforms'])
          eksik = beklenen - set(merged['platforms'])
          assert not eksik, f'Güncelleme manifestinde eksik platform: {sorted(eksik)}'
          pathlib.Path('dagitim/latest.json').write_text(json.dumps(merged, indent=2))
          PY
          ls -lh dagitim
      - name: Üç platformun Kits kimliğini doğrula
        run: |
          python - <<'PYTHON'
          import json, pathlib
          from scripts.release_manifest import resolve_kits_commit
          root = pathlib.Path('indirilenler')
          targets = ('aarch64-apple-darwin', 'x86_64-apple-darwin', 'x86_64-pc-windows-msvc')
          manifests = [root / f'fusion-kits-{target}' / 'kits-manifest.json' for target in targets]
          commits = {resolve_kits_commit('', path) for path in manifests}
          if len(commits) != 1:
              raise SystemExit('Platformlar farklı Kits commitleri paketledi; yayın reddedildi.')
          output = pathlib.Path('kanit-girdisi')
          output.mkdir()
          (output / 'kits-manifest.json').write_text(json.dumps({'commit': commits.pop()}))
          PYTHON
      # Preserve the exact final bytes before acceptance; no separate job can
      # precompute evidence for artifacts that did not exist yet.
      - name: Kabul bekleyen yayın adayını sakla
        uses: actions/upload-artifact@v4
        with:
          name: release-acceptance-candidate
          path: dagitim/*
          if-no-files-found: error

  acceptance-actor:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,mcp]'
      - uses: actions/download-artifact@v4
        with:
          name: fusion-frozen-${{ matrix.target }}
          path: frozen
      - name: Açık kabul profilini kopyala (kullanıcı ayarı değiştirilmez)
        run: python -c "from pathlib import Path; Path('acceptance-config.yaml').write_bytes(Path('release/acceptance-profile.yaml').read_bytes())"
      - name: Aynı frozen artefaktı production görevleriyle çalıştır
        shell: bash
        env:
          PYTHONPATH: src:.
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python scripts/release_live.py \
            --archive frozen/fusion-runtime-${{ matrix.target }}.tar.gz \
            --manifest frozen/fusion-runtime-${{ matrix.target }}.json \
            --config acceptance-config.yaml --version "${GITHUB_REF_NAME#v}" --commit "$GITHUB_SHA" \
            --provider-env NVIDIA_NIM_API_KEY --provider-env OPENROUTER_API_KEY --out live-output
      - uses: actions/upload-artifact@v4
        with:
          name: acceptance-run-${{ matrix.target }}
          path: live-output/*
          if-no-files-found: error

  acceptance-verifier:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [acceptance-candidate, acceptance-actor]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      verifier_key_sha256: ${{ steps.verify.outputs.verifier_key_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,mcp]'
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - uses: actions/download-artifact@v4
        with:
          pattern: acceptance-run-*
          path: runs
      - uses: actions/download-artifact@v4
        with:
          name: release-acceptance-candidate
          path: candidate
      - name: Aynı açık kabul profilini kopyala
        run: cp release/acceptance-profile.yaml acceptance-config.yaml
      - name: Bağımsız izole oracle denetimi ve korunmuş imza
        id: verify
        env:
          PYTHONPATH: src:.
        run: |
          python scripts/release_verify.py --runs runs --artifacts candidate \
            --config acceptance-config.yaml --version "${GITHUB_REF_NAME#v}" --commit "$GITHUB_SHA" \
            --target aarch64-apple-darwin --target x86_64-apple-darwin --target x86_64-pc-windows-msvc \
            --out acceptance-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: release-acceptance-evidence
          path: acceptance-evidence/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, macos, windows, terminal, acceptance-verifier]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      # release_manifest.py, known-gaps.json ve kilit dosyaları (uv.lock, package-lock,
      # Cargo.lock) depodan gelir.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: indirilenler
          pattern: fusion-*
      - name: Paketleri tek klasörde topla
        run: |
          mkdir -p dagitim
          find indirilenler -type f \( -name '*.dmg' -o -name '*.exe' \) -exec cp {} dagitim/ \;
          find indirilenler -type f \( -name '*.tar.gz' -o -name '*.sig' \) -exec cp {} dagitim/ \;
          find indirilenler -type f -name '*.whl' -exec cp {} dagitim/ \;
          find indirilenler -type f -name 'fusion-runtime-*.json' -exec cp {} dagitim/ \;
          python - <<'PY'
          import json, pathlib
          # Sayı değil PLATFORM KÜMESİ doğrulanır. Eskiden "tam iki manifest"
          # aranıyordu ve bu, Windows manifesti eklendiğinde sessizce kırılırdı;
          # ayrıca hangi platformun eksik olduğunu da söylemiyordu. Ölçüldü
          # (alpha.12): latest.json yalnız iki macOS taşıyordu ve Windows
          # kullanıcıları otomatik güncelleme alamıyordu.
          beklenen = {'darwin-aarch64', 'darwin-x86_64', 'windows-x86_64'}
          manifests = [json.loads(p.read_text()) for p in pathlib.Path('indirilenler').rglob('latest-*.json')]
          assert manifests, 'Hiç güncelleme manifesti bulunamadı'
          merged = {**manifests[0], 'platforms': {}}
          for manifest in manifests:
              assert manifest['version'] == merged['version'], (
                  f"Sürümler ayrıştı: {manifest['version']} != {merged['version']}"
              )
              merged['platforms'].update(manifest['platforms'])
          eksik = beklenen - set(merged['platforms'])
          assert not eksik, f'Güncelleme manifestinde eksik platform: {sorted(eksik)}'
          pathlib.Path('dagitim/latest.json').write_text(json.dumps(merged, indent=2))
          PY
          ls -lh dagitim
      - name: Üç platformun Kits kimliğini doğrula
        run: |
          python - <<'PYTHON'
          import json, pathlib
          from scripts.release_manifest import resolve_kits_commit
          root = pathlib.Path('indirilenler')
          targets = ('aarch64-apple-darwin', 'x86_64-apple-darwin', 'x86_64-pc-windows-msvc')
          manifests = [root / f'fusion-kits-{target}' / 'kits-manifest.json' for target in targets]
          commits = {resolve_kits_commit('', path) for path in manifests}
          if len(commits) != 1:
              raise SystemExit('Platformlar farklı Kits commitleri paketledi; yayın reddedildi.')
          output = pathlib.Path('kanit-girdisi')
          output.mkdir()
          (output / 'kits-manifest.json').write_text(json.dumps({'commit': commits.pop()}))
          PYTHON
      # Preserve the exact final bytes before acceptance; no separate job can
      # precompute evidence for artifacts that did not exist yet.
      - name: Kabul bekleyen yayın adayını sakla
        uses: actions/upload-artifact@v4
        with:
          name: fusion-release-candidate
          path: dagitim/*
          if-no-files-found: error
      - uses: actions/download-artifact@v4
        with:
          name: release-acceptance-evidence
          path: acceptance-evidence
      - run: python -m pip install -e .
      - name: Kanıt paketi (SHA256SUMS, SBOM, manifest)
        env:
          PYTHONPATH: src:.
        # Q1-05: kanıt YAYINLANAN dosyalar için üretilir. Eskiden ayrı iş akışı
        # yalnız wheel/sdist'i özetliyordu; DMG/EXE/güncelleme paketi hiç
        # girmiyordu. `dagitim/` Release'e yüklenen klasörün kendisidir; özetler
        # yükleme öncesi yeniden doğrulanır. Kanıt dosyaları `kanit/`te kalır ki
        # kendi özetlerini içermesin.
        run: |
          python scripts/release_manifest.py \
            --version "${GITHUB_REF_NAME#v}" \
            --commit "$GITHUB_SHA" \
            --kits-manifest kanit-girdisi/kits-manifest.json \
            --artifacts dagitim \
            --out kanit \
            --require-live-acceptance \
            --live-acceptance acceptance-evidence/live-acceptance.json \
            --live-acceptance-signature acceptance-evidence/live-acceptance.sig \
            --live-acceptance-key acceptance-evidence/verifier.pub \
            --live-acceptance-key-sha256 "${{ needs.acceptance-verifier.outputs.verifier_key_sha256 }}"
          (cd dagitim && sha256sum -c ../kanit/SHA256SUMS)
      - name: Release oluştur ve dosyaları yükle
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dagitim/*
            kanit/*
          generate_release_notes: true
          make_latest: true
          body: |
            Fusion masaüstü uygulaması. Kurulum yalnız indirip açmaktır; Python,
            Terminal ya da başka bir kurulum gerekmez.

            | Bilgisayarın | İndir |
            |---|---|
            | Mac (Apple M1/M2/M3/M4) | `Fusion-macOS-Apple-Silicon.dmg` |
            | Mac (Intel) | `Fusion-macOS-Intel.dmg` |
            | Windows | `Fusion-Windows-Kurulum.exe` |

            Terminal sürümü ayrı Python wheel (`fusion_cli-*.whl`) ve kaynak
            arşivi olarak eklenir. Python 3.11+ ile `pipx install <wheel-dosyası>`
            kullanın veya README'deki `setup.sh` / `install.ps1` adımlarını izleyin.

            0.3.0-alpha.9 ve sonrası macOS kurulumları kontrol panelinden imzalı
            güncelleme alabilir. Güncellemeden önce çalışan görevleri tamamlayın.

            Mac'inin hangisi olduğunu bilmiyorsan:  → Bu Mac Hakkında.
            "Çip: Apple ..." yazıyorsa Apple Silicon, "İşlemci: Intel" yazıyorsa Intel.

            **macOS paketi ad-hoc imzalıdır; noter onaylı değildir. Windows paketi
            sertifika imzalı değildir.** İlk açılışta işletim sistemi uyarı gösterir:

            - **macOS:** Uygulamalar klasöründe Fusion'a sağ tıkla → **Aç** → tekrar **Aç**.
            - **Windows:** "Windows bilgisayarınızı korudu" ekranında
              **Ek bilgi** → **Yine de çalıştır**.

            Bu yalnız ilk açılışta gerekir.
