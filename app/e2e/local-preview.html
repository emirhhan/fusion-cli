<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fusion yerel önizleme fixture</title>
    <style>
      :root { color: #122117; font: 14px/1.5 Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: linear-gradient(145deg, #f6fff3, #e4f8dc); }
      main { display: grid; min-height: 100vh; place-items: center; padding: 32px; }
      article { width: min(560px, 100%); padding: 32px; border: 1px solid #b9dcb0; border-radius: 22px; background: rgb(255 255 255 / 82%); box-shadow: 0 24px 60px rgb(28 71 37 / 12%); }
      span { color: #3d6b45; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
      h1 { margin: 12px 0 8px; font-size: clamp(28px, 6vw, 48px); line-height: 1.05; }
      p { margin: 0; color: #53705a; }
      i { display: inline-block; width: 10px; height: 10px; margin-right: 8px; border-radius: 50%; background: #9cff28; box-shadow: 0 0 0 5px rgb(156 255 40 / 18%); }
    </style>
  </head>
  <body>
    <main>
      <article>
        <span><i></i>Yerel geliştirme sunucusu</span>
        <h1>Fusion önizleme hazır.</h1>
        <p>Dosyayı kaydettiğinde bu alan yenilenir; masaüstü, tablet ve mobil ölçülerini üst çubuktan değiştirebilirsin.</p>
      </article>
    </main>
  </body>
</html>
