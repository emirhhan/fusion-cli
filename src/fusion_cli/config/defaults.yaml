# ---------------------------------------------------------------------------
# Profil uygunluk eşikleri — model seçim ekranı aktif profile göre bunlarla süzülür.
#
# Filtre YALNIZCA bilinen-kötü modeli eler; doğrulanmamış (bilinmeyen) yetenek
# gizlenmez. Gerçekçilik: canlı katalog modellerinin çoğunun araç desteği ve
# reasoning'i doğrulanmamıştır — hepsini gizlemek listeyi işe yaramaz hale getirir.
#
#   min_context   : gereken en az bağlam (token). 0 = sınır yok. Model bağlamı
#                   BİLİNİYOR ve altındaysa elenir; bilinmiyorsa (0) elenmez.
#   allow_no_tools: araçsız (NONE) modele bu profilde izin var mı? Mutation
#                   profilleri (medium+) false verir — araçsız model dosya
#                   değiştiren agent olamaz (master prompt §5.3).
#
# 128000 eşiği: çok dosyalı/mimari işler büyük bağlam ister; OpenRouter model
# meta verisinde 128K, ciddi kodlama modelleri için yaygın alt sınırdır.
profile_eligibility:
  low:
    min_context: 0
    allow_no_tools: true
  medium:
    min_context: 0
    allow_no_tools: false
  high:
    min_context: 128000
    allow_no_tools: false
  max:
    min_context: 128000
    allow_no_tools: false

# ---------------------------------------------------------------------------
# Ajanın bağlanacağı dış MCP sunucuları (opsiyonel). Her giriş stdio ile başlatılır.
# Örnek:
#   mcp_servers:
#     - name: github
#       command: npx
#       args: ["-y", "@modelcontextprotocol/server-github"]
# Boş liste = MCP istemcisi hiç kurulmaz (varsayılan).
mcp_servers: []

# ---------------------------------------------------------------------------
# Web sağlayıcıları (opsiyonel). İki transport vardır:
# - http: kullanıcının kendi OpenAI-uyumlu ucu (OpenWebUI/LibreChat/kurumsal uç).
# - browser: kullanıcının kendi ChatGPT/Claude/Gemini/Copilot aboneliğini Fusion'ın
#   izole Playwright profiliyle açar. Normal tarayıcı profili okunmaz; CAPTCHA/anti-bot
#   bypass yapılmaz. Cookie değeri config'e girmez, yalnız `credential_ref` metadata'sı
#   bulunur; sır şifreli depoda saklanır. Bu bölüm normalde Control Panel tarafından yazılır.
# Örnek metadata (cookie DEĞİL):
#   web_sessions:
#     - model: chatgpt_web/main/auto
#       provider: chatgpt_web
#       account: main
#       transport: browser
#       credential_ref: WEB_SECRET::chatgpt_web::main
#       tool_support: emulated
# Boş liste = web sağlayıcı yok (varsayılan).
web_sessions: []
