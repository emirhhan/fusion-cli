# Fusion-CLI varsayılan yapılandırması — TEK DOĞRULUK KAYNAĞI.
#
# Kod içinde varsayılan değer YAZILMAZ; her ayarın varsayılanı burada durur.
# Kullanıcı yapılandırması bunun ÜZERİNE derin birleştirilir, bu dosya değişmez.
#
# Model kimlikleri LiteLLM biçimindedir: "<sağlayıcı>/<model>"
#   OpenRouter  -> openrouter/<id>
#   NVIDIA NIM  -> nvidia_nim/<id>

# Agent motorunun kullandığı model. `fallback` yedek zinciridir: birincil model ile
# AYNI ANDA denenir, ilk başarılı yanıt kazanır (hedged istek). Böylece bir sağlayıcı
# 429/soğuk başlangıç verse bile tur beklemez.
#
# Aşağıdaki üçlü 2026-07-23'te canlı ölçümle DOĞRULANMIŞTIR (yanıt süreleri: 1.1s / 1.1s / 2.5s).
# Yedek zinciri bilinçli olarak hem farklı SAĞLAYICIYA hem farklı MODELE yayılır:
#   1) NIM kotası dolarsa aynı model OpenRouter'dan gelir,
#   2) o model tamamen erişilemezse bambaşka bir aile (gpt-oss) devralır.
# Böylece tek nokta arızası kalmaz.
agent:
  name: nemotron-super
  model: nvidia_nim/nvidia/nemotron-3-super-120b-a12b
  tags: [code, agent, reasoning]
  fallback:
    - openrouter/nvidia/nemotron-3-super-120b-a12b:free
    - openrouter/openai/gpt-oss-20b:free

# Çalışma zamanı davranışı.
runtime:
  # Takılan çağrı bu sürede düşer.
  #
  # Ölçülen üretim hızı (2026-07-25, nemotron-3-super): ~104 token/s. Aşağıdaki
  # max_tokens tamamen kullanılırsa çağrı ~80s sürer; 45s bu turu ORTASINDA keserdi.
  # 120s tam bir üretime yer bırakır, gerçekten takılan çağrıyı yine de düşürür.
  request_timeout_s: 120
  # Sağlayıcı içi yeniden deneme. Hedging zaten yatay dayanıklılık sağladığından düşük tutulur.
  max_retries: 1
  temperature: 0.3
  # Tur başına çıktı bütçesi.
  #
  # DİKKAT: reasoning modellerinde düşünme token'ları da BU bütçeden yenir.
  # Ölçüm (2026-07-25, tek dosyalık açılış sayfası üreten görev):
  #   2048 → finish_reason=length, sayfa yarıda kesildi (</html> hiç gelmedi)
  #   8192 → finish_reason=stop, sayfa tam, 1946 token kullanıldı
  # Yani 2048 kodlama işleri için yapısal olarak yetersizdi; 8192 ölçülen ihtiyacın
  # ~4 katı başlık payı bırakır.
  max_tokens: 8192
  # Yedek zinciri devreye girmeden önce BİRİNCİL modele tanınan öncelik penceresi.
  #
  # Yedekler bilinçli olarak farklı sağlayıcı ve farklı modeldir, dolayısıyla çoğu
  # zaman birincilden küçük ve hızlıdır. Pencere olmadan küçük yedek neredeyse her
  # turda yarışı kazanır ve yukarıda yazan birincil model pratikte hiç kullanılmaz —
  # dayanıklılık sessizce kalite kaybına dönüşür.
  #
  # Değer ÖLÇÜMLE belirlendi (2026-07-25, nvidia_nim/nemotron-3-super, 15 araç şemalı
  # agent çağrısı, 6 örnek): ilk token süresi ortanca 1.09s, maksimum 1.60s. 2.5s tüm
  # sıcak turları birincile bırakır; uç gerçekten soğuksa (ölçülen soğuk başlangıç
  # 6.37s) ya da 429 dönerse yedekler yine devreye girer.
  #
  # 0 yazılırsa eski davranışa (hepsi aynı anda) dönülür.
  hedge_delay_s: 2.5
  # Hakem/sentez/ısıtma gibi deterministik olması gereken çağrılar için sıcaklık.
  judge_temperature: 0.0
  # Ders çıkarımı, bağlam sıkıştırma, öz-denetim gibi yardımcı çağrılar için sıcaklık.
  utility_temperature: 0.1

  # --- Fusion zamanlaması ---
  # Hakem için SIKI son tarih: bu sürede JSON gelmezse hakem atlanır, sezgisel kazanan
  # seçilir. Sentez yine üretilir → kullanıcı hiçbir senaryoda beklemede kalmaz.
  judge_timeout_s: 20
  # Reasoning modelleri önce "düşünür", sonra JSON/talimat verir; ikisi bu bütçeye
  # sığmalıdır.
  #
  # Ölçüm (2026-07-25, nemotron-3-super, 5.4k karakterlik denetim prompt'u, 3 koşu):
  # çıktı 486–1150 token arasında oynuyor — düşünme uzunluğu değişken. 1024 ile denetim
  # talimatı kelime ortasında kesiliyordu ("CSS dosyas") ve yarım talimat agent'a
  # düzeltme emri olarak gidiyordu. 3072, ölçülen en yüksek değerin ~2,7 katı.
  judge_max_tokens: 3072
  # Bu sayının altında başarılı aday kalırsa tur cevapsız biter.
  min_successful_candidates: 1
  # Yeterli cevap geldikten sonra yavaş adaylara tanınan ek süre.
  straggler_grace_s: 6.0
  # İlk cevaptan itibaren adaylar için mutlak üst sınır: soğuk bir uç turu kilitleyemez.
  candidate_hard_cap_s: 25.0
  # Hakem seçtikten sonra tüm cevapları tek üstün cevapta birleştir (bir çağrı daha ekler).
  synthesis: true

  # --- Agent davranışı ---
  # Ardışık araç turu üst sınırı. Model bir döngüye takılırsa tur burada kesilir.
  # Yalnızca patolojik döngüye karşı emniyet supabı; normal uzun işleri kesmemesi
  # için yüksek tutulur (25 pratikte çok işi yarıda kesiyordu).
  agent_max_steps: 200
  # Tur bitince denetçi model sonucu kontrol eder; somut sorun bulursa TEK düzeltici
  # tur çalışır. Bir hakem çağrısı ekler, çıktı daha sağlam olur. Hız istiyorsan kapat.
  self_review: true
  # Araç hata döndürünce modele "ne yanlış gitti, farklı yaklaş" notu enjekte edilir.
  # EK MODEL ÇAĞRISI YOK; körlemesine tekrarı önler.
  reflexion: true
  # Her görevden ders çıkarılır ve benzer görevlerde sistem promptunda hatırlatılır.
  # Öz-gelişimin çekirdeği; bir model çağrısı ekler.
  lessons: true
  # Kod değiştiren tur sonrası çalıştırılacak doğrulama komutları. Boş = KAPALI
  # (varsayılan): mevcut davranış korunur. Doldurulursa (ör. ["ruff check", "pytest -q"])
  # kapının sonucu ders güvenini besler — "doğrulamadan bitirme" kuralı gerçekten uygulanır.
  verification_commands: []
  # Üretilen HTML/CSS/JS mekanik olarak denetlenir: kapanmış görsel servisi, boş
  # bağlantı (href="#"), eksik <main>, CSS'te karşılığı olmayan sınıf oranı ve
  # sayfada vaat edilen tutarın kodda bulunmaması.
  #
  # Varsayılan AÇIK. Ölçüm: model prompt'ta AÇIKÇA yasaklanan şeyleri yapıyor
  # ("bozuk görsel, boş bağlantı bulunmasın" denmesine rağmen 12 kırık görsel ve
  # 18 boş bağlantı üretti) ama araç sonucuna tepki verip düzeltiyor. Bu yüzden
  # kural prompt'ta değil kapıda durur; bulgular modele talimat olarak döner.
  web_verification: true
  # Üretilen sayfa GERÇEKTEN açılıp ölçülür: konsol hataları, yüklenemeyen kaynaklar
  # ve 375/768/1440 px genişliklerinde yatay taşma. Bunlar metin taramasıyla
  # görülemez — kullanıcının şartnamesinde "yatay taşma veya konsol hatası
  # bulunmasın" yazmasına rağmen statik kapı 24 konsol hatasını göremedi.
  #
  # Playwright ZORUNLU DEĞİLDİR: `pip install "fusion-cli[web]"` ile gelir ve ardından
  # `playwright install chromium` gerekir. Kurulu değilse kapı sessizce geçer.
  browser_verification: true
  # Üretilen sayfa bölgelere kırpılıp GÖREN bir modele dar sorular sorulur
  # (header tek satırda mı, hero'da aşırı boşluk var mı, metin okunuyor mu).
  #
  # Varsayılan KAPALI ve bu bilinçli. Ölçüm (2026-07-25): ücretsiz görme modelleri
  # tek soru + kırpılmış bölge ile doğru cevap veriyor ("kalp ikonu çok büyük"), ama
  # açık uçlu "hataları listele" ile ya susuyor ya olmayan hata uyduruyor; dört soru
  # tek çağrıda sorulunca ayırt etme gücü sıfıra düşüyor. Bu yüzden her soru ayrı
  # çağrıdır ve pahalıdır. Geometriyle ÖLÇÜLEBİLEN hiçbir şey buraya sorulmaz.
  visual_verification: false
  # İstek bir playbook'u (deterministik çok-adımlı akış) tetiklerse serbest ReAct
  # döngüsü yerine o akış çalışır — daha az model çağrısı, öngörülebilir sonuç.
  # KAPALI (varsayılan): mevcut agent davranışı birebir korunur.
  playbooks: false
  # Zor görevlerde serbest döngü yerine aşamalı workflow (localize→plan→patch→verify→
  # review) çalışır; tur başına SABİT model-çağrısı bütçesiyle maliyet öngörülebilir olur.
  # KAPALI (varsayılan): mevcut agent davranışı birebir korunur.
  workflow_mode: false
  workflow_max_model_calls: 12

# ---------------------------------------------------------------------------
# Fusion havuzu: aynı görev bu modellere PARALEL sorulur, hakem en iyisini seçer,
# sentez hepsinin en iyi yanlarını tek cevapta birleştirir.
#
# Üçü de 2026-07-23'te canlı ölçümle doğrulanmıştır. Her adayın yedeği bilinçli
# olarak FARKLI bir sağlayıcıdadır: bir sağlayıcının kotası dolduğunda havuz çökmez.
candidates:
  - name: nemotron-super
    model: nvidia_nim/nvidia/nemotron-3-super-120b-a12b
    tags: [reasoning, general]
    fallback:
      - openrouter/nvidia/nemotron-3-super-120b-a12b:free
  - name: nemotron-nano
    model: openrouter/nvidia/nemotron-3-nano-30b-a3b:free
    tags: [general]
    fallback:
      - nvidia_nim/nvidia/nemotron-3-nano-30b-a3b
  - name: gpt-oss
    model: openrouter/openai/gpt-oss-20b:free
    tags: [code, agent]
    fallback: []

# Hakem + sentez rolü. Hızlı olmalı ve JSON'a sadık kalmalıdır.
judge:
  name: hakem
  model: openrouter/openai/gpt-oss-20b:free
  fallback:
    - openrouter/nvidia/nemotron-3-super-120b-a12b:free
    - nvidia_nim/nvidia/nemotron-3-super-120b-a12b

# Görme yetenekli model — görsel doğrulama kapısı için (visual_verification: true ise).
# Ölçüm (2026-07-25): dar soru + kırpılmış bölge ile doğru cevap veriyor.
vision:
  name: goz
  model: nvidia_nim/nvidia/nemotron-nano-12b-v2-vl
  fallback:
    - openrouter/nvidia/nemotron-nano-12b-v2-vl:free

# Görev tipine göre kullanılacak model. Yalnızca yukarıda tanımlı bir aday adı yazılabilir;
# tanınmayan ad sessizce `agent:` rolüne düşer.
#
# Bu harita İKİ motoru birden yönlendirir:
#   fusion — bu adayı havuzun başına alır (hakem yine hepsini görür),
#   agent  — turu doğrudan bu modelle çalıştırır.
#
# Anahtarlar kullanıcının `/type` ile seçtiği tiplerdir (general, code, reasoning, agent).
#
# `code` ve `agent` eskiden gpt-oss'a (20B) bakıyordu. Harita agent motorunda hiç
# uygulanmadığı için bunun bir etkisi yoktu; artık uygulandığına göre kodlama turlarını
# havuzun en küçük modeline yönlendirmek doğrudan kalite kaybı olurdu. İkisi de
# nemotron-super'a alındı: kod ve araç kullanımı havuzun en yetenekli modelini ister.
task_model_map:
  general: nemotron-super
  code: nemotron-super
  reasoning: nemotron-super
  agent: nemotron-super

# ---------------------------------------------------------------------------
# Anlamsal arama için gömme sağlayıcısı (ders belleği + kod indeksi).
#   local — ChromaDB gömülü ONNX modeli. Hızlı, çevrimdışı, anahtarsız. Türkçe: orta.
#   nim   — NVIDIA NIM ücretsiz çok-dilli gömme. Türkçe daha iyi ama her sorguya
#           ağ gecikmesi ekler. Erişilemezse SESSİZCE yerele düşülür.
embedding:
  provider: local
  model: nvidia/nv-embedqa-e5-v5

# ---------------------------------------------------------------------------
# Havuza EKLENECEK adaylar. `candidates` yazarsan varsayılanların yerini alır;
# burası ise onların YANINA ekler. Yerel/açık kaynak modeller için doğru yer:
#
# extra_candidates:
#   - name: qwen-yerel
#     model: ollama/qwen2.5-coder:7b     # önce: ollama serve && ollama pull …
#     tags: [code]
#   - name: llama-yerel
#     model: ollama/llama3.1:8b
#     tags: [general]
#
# vLLM / LM Studio için:  openai/<model>  + OPENAI_API_BASE=http://localhost:8000/v1
# Not: yerel modeller tool-calling desteklemeyebilir; agent modunda düz sohbete düşer.

# ---------------------------------------------------------------------------
# Model kademeleri: tek seçimle agent, hakem ve aday havuzunu birlikte değiştirir.
#
# Beş kademenin TAMAMI ücretsiz modellerden kurulur; ürünün kimliği budur. Ücretli
# modeller yalnızca `/development` akışının 3. seçeneğinden, kullanıcının açık
# tercihiyle girer — bir kademe seçmek asla kredi harcatmaz.
#
# Sıra kullanıcı tercihidir ve YAML'daki yazım sırası kademe sırasıdır.
# `low` bilinçli olarak paketin varsayılanıyla (agent: nemotron-super) aynıdır:
# hiç kademe seçmemiş bir kullanıcı ile `low` seçen kullanıcı aynı modeli kullanır.
#
# Model kimlikleri 2026-07-25'te OpenRouter ücretsiz kataloğundan doğrulanmıştır.
tiers:
  - name: low
    label: Varsayılan — hızlı ve dengeli
    agent:
      name: nemotron-super
      model: nvidia_nim/nvidia/nemotron-3-super-120b-a12b
      tags: [code, agent, reasoning]
      fallback:
        - openrouter/nvidia/nemotron-3-super-120b-a12b:free
        - openrouter/openai/gpt-oss-20b:free
    judge:
      name: hakem
      model: openrouter/openai/gpt-oss-20b:free
      fallback: [openrouter/nvidia/nemotron-3-super-120b-a12b:free]
    candidates:
      - name: nemotron-super
        model: nvidia_nim/nvidia/nemotron-3-super-120b-a12b
        tags: [reasoning, general]
        fallback: [openrouter/nvidia/nemotron-3-super-120b-a12b:free]
      - name: gpt-oss
        model: openrouter/openai/gpt-oss-20b:free
        tags: [code, agent]

  - name: medium
    label: Daha büyük model — 550B, geniş bağlam
    agent:
      name: nemotron-ultra
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      tags: [code, agent, reasoning]
      fallback: [nvidia_nim/nvidia/nemotron-3-super-120b-a12b]
    judge:
      name: hakem
      model: openrouter/openai/gpt-oss-20b:free
      fallback: [openrouter/nvidia/nemotron-3-super-120b-a12b:free]
    candidates:
      - name: nemotron-ultra
        model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
        tags: [reasoning, general]
        fallback: [openrouter/nvidia/nemotron-3-super-120b-a12b:free]
      - name: nemotron-super
        model: nvidia_nim/nvidia/nemotron-3-super-120b-a12b
        tags: [code, agent]
        fallback: [openrouter/nvidia/nemotron-3-super-120b-a12b:free]

  - name: high
    label: Kodlamaya ayarlı model
    agent:
      name: laguna-m
      model: openrouter/poolside/laguna-m.1:free
      tags: [code, agent, reasoning]
      fallback: [openrouter/nvidia/nemotron-3-super-120b-a12b:free]
    judge:
      name: hakem
      model: openrouter/openai/gpt-oss-20b:free
      fallback: [openrouter/nvidia/nemotron-3-super-120b-a12b:free]
    candidates:
      - name: laguna-m
        model: openrouter/poolside/laguna-m.1:free
        tags: [code, agent]
      - name: nemotron-super
        model: nvidia_nim/nvidia/nemotron-3-super-120b-a12b
        tags: [reasoning, general]
        fallback: [openrouter/nvidia/nemotron-3-super-120b-a12b:free]

  - name: ultra
    label: Gemma 4 — 31B, güçlü genel dil
    agent:
      name: gemma-4
      model: openrouter/google/gemma-4-31b-it:free
      tags: [code, agent, reasoning]
      fallback: [openrouter/google/gemma-4-26b-a4b-it:free]
    judge:
      name: hakem
      model: openrouter/openai/gpt-oss-20b:free
      fallback: [openrouter/nvidia/nemotron-3-super-120b-a12b:free]
    candidates:
      - name: gemma-4
        model: openrouter/google/gemma-4-31b-it:free
        tags: [general, reasoning]
        fallback: [openrouter/google/gemma-4-26b-a4b-it:free]
      - name: nemotron-super
        model: nvidia_nim/nvidia/nemotron-3-super-120b-a12b
        tags: [code, agent]
        fallback: [openrouter/nvidia/nemotron-3-super-120b-a12b:free]

  - name: premium
    label: Ling 3.0 — en geniş aday havuzu
    agent:
      name: ling-flash
      model: openrouter/inclusionai/ling-3.0-flash:free
      tags: [code, agent, reasoning]
      fallback: [openrouter/nvidia/nemotron-3-ultra-550b-a55b:free]
    judge:
      name: hakem
      model: openrouter/openai/gpt-oss-20b:free
      fallback: [openrouter/nvidia/nemotron-3-super-120b-a12b:free]
    candidates:
      - name: ling-flash
        model: openrouter/inclusionai/ling-3.0-flash:free
        tags: [general, reasoning]
      - name: nemotron-ultra
        model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
        tags: [reasoning]
        fallback: [openrouter/nvidia/nemotron-3-super-120b-a12b:free]
      - name: laguna-m
        model: openrouter/poolside/laguna-m.1:free
        tags: [code, agent]
