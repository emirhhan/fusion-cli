# Başlangıç değerlendirme seti.
#
# Her görev bir istek ve tek bir ölçülebilir başarı ölçütüdür. Ölçüt türleri:
#   - exit_code:   çalıştırılan komutun çıkış kodu `expected_exit_code`'a eşit mi
#   - file_changed: `expected_path` değişen dosyalar arasında mı
#   - keyword:     çıktı metninde `keyword` geçiyor mu
#
# Kural: secret/PII yok. Görevler zamanla büyür (hedef 20-40); bu dosya çekirdektir.
tasks:
  - id: hello-yaz
    request: "Proje köküne 'merhaba dünya' yazan hello.py adında bir dosya oluştur."
    criterion:
      kind: file_changed
      expected_path: hello.py

  - id: readme-baslik-ekle
    request: "README.md dosyasının başına 'Kurulum' başlıklı bir bölüm ekle."
    criterion:
      kind: file_changed
      expected_path: README.md

  - id: testler-gecmeli
    request: "Depodaki testleri çalıştır ve hepsinin geçtiğini doğrula."
    criterion:
      kind: exit_code
      expected_exit_code: 0

  - id: lint-temiz
    request: "ruff check çalıştır; kod stilinin temiz olduğunu doğrula."
    criterion:
      kind: exit_code
      expected_exit_code: 0

  - id: fonksiyon-adi-bul
    request: "Kod tabanında kosinüs benzerliğini hesaplayan fonksiyonun adını bul."
    criterion:
      kind: keyword
      keyword: cosine

  - id: bagimlilik-listele
    request: "Projenin doğrudan bağımlılıklarından litellm'in adını çıktı olarak ver."
    criterion:
      kind: keyword
      keyword: litellm

  - id: gitignore-venv
    request: ".gitignore dosyasında .venv göz ardı ediliyor mu, doğrula."
    criterion:
      kind: keyword
      keyword: .venv

  - id: yeni-modul-ekle
    request: "src altında toplama yapan bir util modülü ekle."
    criterion:
      kind: file_changed
      expected_path: src/fusion_cli/core/mathx.py

  - id: surum-oku
    request: "pyproject.toml içindeki proje sürümünü oku ve yazdır."
    criterion:
      kind: keyword
      keyword: "0.2.0"

  - id: format-uygula
    request: "ruff format çalıştır; kodun biçimlendirilmiş olduğunu doğrula."
    criterion:
      kind: exit_code
      expected_exit_code: 0
