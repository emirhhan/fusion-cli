# Başlangıç değerlendirme seti — KENDİ KENDİNE YETER.
#
# Her görev boş bir çalışma dizininde (scratch) koşturulur; depoya bağımlı değildir.
# Böylece `python -m evals run` kutudan çıkar çıkmaz anlamlı ölçüm verir.
#
# Ölçüt türleri:
#   - file_changed: `expected_path` çalışma dizininde oluştu/değişti mi
#   - keyword:      agent'ın nihai cevabında `keyword` geçiyor mu
#   - exit_code:    görev sonrası `command` çalıştırılınca çıkış kodu `expected_exit_code` mi
#
# Kural: secret/PII yok. Görevler zamanla büyür (hedef 20-40); bu dosya çekirdektir.
tasks:
  - id: hello-dosyasi-olustur
    request: "Çalışma dizinine, çalıştırıldığında 'merhaba dünya' yazan hello.py adında bir Python dosyası oluştur."
    criterion:
      kind: file_changed
      expected_path: hello.py

  - id: hello-calisir
    request: "Çalışma dizinine, çalıştırıldığında 'merhaba dünya' yazan hello.py oluştur; python hello.py hatasız çalışmalı."
    criterion:
      kind: exit_code
      expected_exit_code: 0
      command: python hello.py

  - id: notlar-dosyasi
    request: "notes.txt adında bir dosya oluştur ve içine tek satır 'ilk not' yaz."
    criterion:
      kind: file_changed
      expected_path: notes.txt

  - id: json-olustur
    request: "config.json adında geçerli bir JSON dosyası oluştur; içinde \"ad\" anahtarı bulunsun."
    criterion:
      kind: file_changed
      expected_path: config.json

  - id: toplama-fonksiyonu
    request: "topla(a, b) fonksiyonunu içeren toplama.py oluştur; iki sayının toplamını döndürsün."
    criterion:
      kind: file_changed
      expected_path: toplama.py

  - id: python-surumu-soru
    request: "Bir Python dosyasının uzantısı nedir? Kısaca cevapla."
    criterion:
      kind: keyword
      keyword: .py

  - id: markdown-baslik
    request: "README.md adında bir dosya oluştur ve ilk satırına '# Proje' başlığını yaz."
    criterion:
      kind: file_changed
      expected_path: README.md

  - id: shell-script
    request: "merhaba.sh adında, ekrana 'selam' yazan bir bash betiği oluştur."
    criterion:
      kind: file_changed
      expected_path: merhaba.sh
