# Yerel production smoke; OAuth ve uygulama sohbet izolasyonu ayrıca kabul gerektirir.
tasks:
- id: godot-asset-lisansli
  request: Mevcut Godot projesine assets/player.png için gerçek bir PNG ve assets/ASSETS.json içinde
    source_url ile license kaydı ekle. project.godot dosyasını koru.
  setup:
    project.godot: |
      [application]
      config/name="Fusion Eval"
  criterion:
    kind: exit_code
    expected_exit_code: 0
    command: python -c "from pathlib import Path; from fusion_cli.core.assets import inspect_image_asset,
      validate_asset_manifest; p=Path('assets/player.png'); assert inspect_image_asset(p).valid;
      assert not validate_asset_manifest(p, Path('.'))"
  budget:
    max_model_calls: 30
    timeout_s: 180
- id: mcp-stdio-listele-cagir
  request: smoke_test.py içinde async smoke(client) yaz. Verilen gerçek MCP istemcisinde önce await
    client.list_tools() ile ping aracını listele, sonra await client.call_tool("ping", {}) ile çağır.
    Sunucuyu kendin başlatma; kabul harness gerçek sırsız stdio MCP oturumunu sağlar. Bu görev OAuth
    girişini ölçmez.
  setup:
    smoke_test.py: |
      async def smoke(client):
          pass
  criterion:
    kind: exit_code
    expected_exit_code: 0
    command: python -m evals.fixtures.production_acceptance mcp
  budget:
    max_model_calls: 30
    timeout_s: 180
- id: yanlis-hedefte-yeniden-planla
  request: config.json yanlışlıkla legacy/config.json diye tarif edilmiş. Önce gerçek yolu bul, sonra
    config.json içindeki enabled değerini true yap; olmayan legacy yolunu oluşturma.
  setup:
    config.json: '{"enabled": false}'
  criterion:
    kind: exit_code
    expected_exit_code: 0
    command: python -c "import json,os; assert json.load(open('config.json'))['enabled'] is True;
      assert not os.path.exists('legacy')"
  budget:
    max_model_calls: 30
    timeout_s: 180
- id: buyuk-artifact-korumali-duzenleme
  request: large.py içindeki TARGET değerini 42 yap. Diğer sabitleri ve dosya yapısını koru.
  setup:
    large.py:
      segments:
      - |
        HEADER = "keep"
      - repeat: |
          # Korunacak kayit: abcdefghijklmnopqrstuvwxyz
        count: 1536
      - |
        TARGET = 1
      - repeat: |
          # Korunacak kayit: abcdefghijklmnopqrstuvwxyz
        count: 1536
      - |
        FOOTER = "keep-too"
  criterion:
    kind: exit_code
    expected_exit_code: 0
    command: python -m evals.fixtures.production_acceptance large
  budget:
    max_model_calls: 30
    timeout_s: 180
- id: json-dosya-izolasyonu
  request: conversation-a.json ve conversation-b.json dosyalarını oku. Yalnız conversation-a.json
    içindeki status alanını done yap; diğer sohbet dosyasına dokunma.
  setup:
    conversation-a.json: '{"status": "pending", "owner": "a"}'
    conversation-b.json: '{"status": "pending", "owner": "b"}'
  criterion:
    kind: exit_code
    expected_exit_code: 0
    command: python -c "import json; a=json.load(open('conversation-a.json')); b=json.load(open('conversation-b.json'));
      assert a=={'status':'done','owner':'a'}; assert b=={'status':'pending','owner':'b'}"
  budget:
    max_model_calls: 30
    timeout_s: 180
